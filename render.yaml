services:
  - type: web
    name: eksera
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: EKSERA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: id_ID

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-1-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.rhuxirysaknhtpdnjhnh
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log

      # Upload foto disimpan di Supabase Storage (S3 compatible)
      - key: FILESYSTEM_PUBLIC_DRIVER
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: ap-northeast-1
      - key: AWS_BUCKET
        value: eksera
      - key: AWS_ENDPOINT
        value: https://rhuxirysaknhtpdnjhnh.supabase.co/storage/v1/s3
      - key: AWS_URL
        value: https://rhuxirysaknhtpdnjhnh.supabase.co/storage/v1/object/public/eksera
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
